[project]
name = "decisense"
version = "0.1.0"
description = "Local-first agentic AI system for tabular data science workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.4.2",
    "openpyxl>=3.1.5",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "scikit-learn>=1.4.0",
]

[project.scripts]
decisense = "ds_engine.interfaces.decisense_cli:main"

[project.optional-dependencies]
catboost = [
    "catboost>=1.2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.15.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ds_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".smoke",
    "runs",
    "bot_state",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]
ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"