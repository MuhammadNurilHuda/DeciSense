[project]
name = "decisense"
version = "0.1.0"
description = "Agentic AI system for automated tabular data science workflows"
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "Nuril Huda" }
]

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "pytest>=9.0.2",
    "openpyxl>=3.1.5",
    "pyarrow>=23.0.1",
]

keywords = ["data-science", "machine-learning", "agentic-ai", "tabular"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "openpyxl>=3.1.0",
    "pyarrow>=14.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["ds_engine*"]
exclude = ["tests*", "runs*", "openclaw*", "bot_state*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
]
